name: scrape
on:
  # GitHub's own timer often runs late or skips hours, so an outside timer (cron-job.org) also
  # starts this every hour through the API; whichever comes first runs, the other is skipped
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if the last run was under 40 minutes ago"
        type: boolean
        default: false
permissions:
  contents: write   # push the data branch
  pages: write      # publish the dashboard
  id-token: write
concurrency: scrape
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # the listings live on a `data` branch that holds a single commit, so hourly
      # updates don't pile up in the repo's history (the copy in main only seeds the first run)
      - name: Get the last run's listings
        id: last
        run: |
          if git fetch --depth=1 origin data; then
            git show FETCH_HEAD:listings.json > data/listings.json
            age=$(( $(date +%s) - $(git log -1 --format=%ct FETCH_HEAD) ))
            echo "last run finished $((age / 60)) minutes ago"
            if [ "$age" -lt 2400 ] && [ "${{ inputs.force }}" != "true" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
          else echo "no data branch yet: starting from the copy in the repo"; fi

      - if: steps.last.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - if: steps.last.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - if: steps.last.outputs.skip != 'true'
        run: python -m scraper.run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PREFERENCES_JSON: ${{ secrets.PREFERENCES_JSON }}   # optional: keeps saved searches private

      - name: Save listings to the data branch
        if: steps.last.outputs.skip != 'true'
        run: |
          mkdir /tmp/data && cp data/listings.json /tmp/data/ && cd /tmp/data
          git init -q -b data && git add listings.json
          git -c user.name=scraper-bot -c user.email=scraper-bot@users.noreply.github.com commit -qm "listings"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" data

      - name: Build the dashboard
        if: steps.last.outputs.skip != 'true'
        run: mkdir -p _site/data && cp index.html _site/ && cp data/listings.json _site/data/
      - if: steps.last.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deploy
        if: steps.last.outputs.skip != 'true'
        uses: actions/deploy-pages@v4
